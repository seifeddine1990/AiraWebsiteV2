server {
    listen       8080;
    listen  [::]:8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://formsubmit.co; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; script-src 'self'; form-action mailto:; frame-ancestors 'self'" always;

    # Compression
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Static assets: long cache
    location ~* \.(css|js|svg|png|jpg|jpeg|webp|woff2?|xml)$ {
        # expires supplies Cache-Control without overriding inherited security headers.
        expires 7d;
    }

    # Clean routing + custom 404
    location / {
        try_files $uri $uri/ =404;
    }
    error_page 404 /404.html;

    # No logs for favicons/robots noise
    location = /favicon.svg { access_log off; }
    location = /robots.txt  { access_log off; }
    # Let crawlers pick up sitemap changes promptly instead of the asset cache.
    location = /sitemap.xml { expires 1h; }
}
